<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State Embedding</title>
<style>
  :root {
    --ink: #1c1917;
    --muted: #6e665e;
    --line: #e4dcd0;
    --paper: #f3efe7;
    --card: #fffdf9;
    --hot: #9a4e12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif;
  }
  header {
    margin: 0;
    padding: 28px 28px 8px 32px;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  h1 { margin: 0; font-size: 28px; font-weight: 560; letter-spacing: -0.02em; }
  .stage {
    display: grid;
    grid-template-columns: 720px max-content;
    gap: 28px;
    width: max-content;
    margin: 0;
    padding: 12px 28px 48px 32px;
    justify-content: start;
    align-items: start;
  }
  .canvas {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 8px 20px;
    position: sticky;
    top: 16px;
    left: 32px;
    width: 720px;
    max-width: 720px;
    z-index: 1;
  }
  #diagram { width: 100% !important; height: auto; display: block; }
  #diagram [data-tip] { cursor: pointer; }
  #diagram .node polygon, #diagram .cluster polygon { transition: stroke 0.12s ease; }
  #diagram .is-hot polygon { stroke: var(--hot); stroke-width: 1.6; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 22px 18px;
    min-height: 220px;
    position: sticky;
    top: 16px;
    width: max-content;
    max-width: none;
  }
  .card .kicker {
    font-family: "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 560; }
  .card .shape {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    background: #f6f1e8;
    border-radius: 8px;
    padding: 3px 8px;
    margin-bottom: 12px;
  }
  .card p {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .card svg.inset {
    display: block;
    height: auto;
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: white;
  }
  .card .hint { color: var(--muted); }
</style>
</head>

<script>
const TIPS = {"t0": {"title": "cell expression matrix", "shape": "(1, n_genes)", "body": "n_genes 是该数据集的基因数。按 pad_length = 2048 抽出 cell sentence（位置 0 留给 CLS），再去查 ESM-2，得到 (1, 2048, 5120)；同一批基因的表达量权重是 (1, 2048)", "svg": ""}, "t1": {"title": "TokenEncoder", "shape": "5120 → 512", "body": "图上的名字。代码里是 self.encoder，不是一个叫 TokenEncoder 的类。", "svg": ""}, "t2": {"title": "CountEncoder", "shape": "标量 → 512", "body": "图上的名字。代码里接近 self.count_encoder，再加 self.bin_encoder。", "svg": ""}, "t3": {"title": "TransformerStack", "shape": "8 层，宽度 512，16 头", "body": "双向 Transformer。token 是基因，不是细胞。一次前向只有一个细胞的句子。", "svg": ""}, "t4": {"title": "ExpressionDecoder", "shape": "512 → 512", "body": "图上的名字。代码里是 self.decoder。不预测表达。预测表达的是下面的 BinaryDecoder。", "svg": ""}, "t5": {"title": "BinaryDecoder", "shape": "1035 → 1", "body": "代码里是 self.binary_decoder。只在训练时跑。把细胞嵌入、目标基因嵌入、测序深度、数据集嵌入拼起来，过两个 SkipBlock，再投成一个数。推理不跑它。", "svg": ""}, "t6": {"title": "ESM-2 Emb", "shape": "(1, 2048, 5120)", "body": "已经算好的基因嵌入。每个基因 5120 维，ESM-2 不在这个模型里面。位置 0 进 Linear 之前会被可学习的 CLS 盖掉。", "svg": ""}, "t7": {"title": "clone", "shape": "(1, 2048, 5120)", "body": "不是仓库里的层。追踪时复制一份张量，好让下一行改位置 0。真实 forward 是直接在查出的嵌入上改位置 0。", "svg": ""}, "t8": {"title": "counts", "shape": "(1, 2048)", "body": "和左边基因一一对应，但不是原始 UMI。每个数是该基因 log1p 表达量占全细胞 log1p 总和的比例，再乘 100。位置 0 是 CLS 的占位。", "svg": ""}, "t9": {"title": "", "shape": "(1, 2048) → (1, 2048, 1)", "body": "给每个 count 加一个特征维，后面的 Linear 才能把一个标量投进 10 个 bin。", "svg": ""}, "t10": {"title": "task gene emb", "shape": "(1, 1536, 512)", "body": "要预测的那些基因，已经过了和上面相同的 self.encoder。不是输入句子里的 2048 个。代码默认 P、N、S 都是 512，所以是 1536。论文里共享基因写成 256，那一版是 1280。", "svg": ""}, "t11": {"title": "cat", "shape": "→ (1, 1536, 1035)", "body": "拼在一起，不是相加。512 的细胞嵌入、512 的基因嵌入、1 维测序深度、10 维数据集嵌入。1035 = 512 + 512 + 1 + 10。", "svg": ""}, "t12": {"title": "read depth", "shape": "(1, 1)", "body": "这个细胞目标基因里非零表达的均值。不是学出来的参数。默认 rda 开着，所以会拼进 BinaryDecoder。", "svg": ""}, "t13": {"title": "view", "shape": "(1, 1) → (1, 1, 1)", "body": "给测序深度补上基因那一维，后面才能复制到 1536 个目标基因上。", "svg": ""}, "t14": {"title": "dataset token", "shape": "(1, 512)", "body": "decoder 在数据集 token 那位的输出，还没投到 10 维。默认 dataset_correction 开着。主句子这张图没把数据集 token 画进 2048，所以它单独进来。", "svg": ""}, "t15": {"title": "Linear", "shape": "(1, 512) → (1, 10)", "body": "代码里是 self.dataset_embedder。把数据集 token 那位的 512 维投成 10 维，再复制到每个要预测的基因上。", "svg": ""}, "t16": {"title": "Linear", "shape": "(1, 2048, 5120) → (1, 2048, 512)", "body": "TokenEncoder 的第一层。把 ESM-2 的 5120 维投到模型宽度 512。CLS 那一位也走这一层。", "svg": ""}, "t17": {"title": "LayerNorm", "shape": "(1, 2048, 512)", "body": "投完维之后做层归一化，再交给 SiLU。形状不变。", "svg": ""}, "t18": {"title": "SiLU", "shape": "(1, 2048, 512)", "body": "TokenEncoder 的激活。没有第二层线性层，这一步还不混合基因之间的信息。", "svg": ""}, "t19": {"title": "mul", "shape": "(1, 2048, 512)", "body": "乘上 √512。这是 Transformer 常用的嵌入缩放，不是 QK 点积之后的那个除法。", "svg": ""}, "t20": {"title": "add", "shape": "2 × (1, 2048, 512) → (1, 2048, 512)", "body": "基因嵌入加上表达量嵌入。相加，不是拼接。", "svg": ""}, "t21": {"title": "Sequential", "shape": "(1, 2048, 1) → (1, 2048, 10)", "body": "原代码是 emb/nn/model.py 里的 count_encoder。虚线框只有前三层。softmax 之后不是再接一个线性层。右边 Embedding 是 bin_encoder，单独初始化的 10 个 512 维向量。", "svg": "count_path"}, "t22": {"title": "softmax", "shape": "(1, 2048, 10)", "body": "把 10 个 bin logits 变成权重。这是软分箱，不是在基因上做 softmax。", "svg": ""}, "t23": {"title": "matmul", "shape": "(1, 2048, 10) → (1, 2048, 512)", "body": "用 bin 权重对 10 个可学习的 bin 向量求加权和。", "svg": ""}, "t24": {"title": "OneEncoderLayer × 8", "shape": "(1, 2048, 512)", "body": "原代码是 emb/nn/flash_transformer.py 的一层。QK 点积再除以 √32 在 scaled_dot_product_attention 里。8 层权重是分开的，图上收成一层再循环。", "svg": "encoder_layer"}, "t25": {"title": "", "shape": "(1, 2048, 512)", "body": "原代码是 emb/nn/model.py 里的 SkipBlock。每个位置单独走 Linear(512→1024)、ReLU、Linear(1024→512)，再和输入相加，最后 LayerNorm。", "svg": "skip_block"}, "t26": {"title": "Linear", "shape": "(1, 2048, 512) → (1, 2048, 512)", "body": "Decoder 的输出投影。宽度还是 512。细胞向量还不在这里取。", "svg": ""}, "t27": {"title": "ClsReadout", "shape": "(1, 2048, 512) → (1, 512)", "body": "只取位置 0，也就是 CLS，再做 L2 归一化。", "svg": ""}, "t28": {"title": "unsqueeze", "shape": "(1, 512) → (1, 1, 512)", "body": "给细胞嵌入加一个基因维，后面才能复制到 1536 个目标基因上。", "svg": ""}, "t29": {"title": "output-tensor", "shape": "(1, 512)", "body": "交出去的细胞嵌入。推理只返回这个。State Transition 用它的时候，每个 token 就是这样一个向量。", "svg": ""}, "t30": {"title": "expand", "shape": "", "body": "", "svg": ""}, "t31": {"title": "unsqueeze", "shape": "(1, 1, 10) → (1, 1536, 10)", "body": "把数据集嵌入复制到每一个要预测的基因。细胞嵌入和测序深度也是这样复制，不是每个基因各算一个。", "svg": ""}, "t32": {"title": "SkipBlock", "shape": "1035 → 1035", "body": "和上面那个 SkipBlock 同一结构，宽度是 1035。输入加回去，再 LayerNorm。这里有两层，权重分开。", "svg": ""}, "t33": {"title": "SkipBlock", "shape": "1035 → 1035", "body": "和上面那个 SkipBlock 同一结构，宽度是 1035。输入加回去，再 LayerNorm。这里有两层，权重分开。", "svg": ""}, "t34": {"title": "Linear", "shape": "(1, 1536, 1035) → (1, 1536, 1)", "body": "每个要预测的基因出一个数，就是它的表达。", "svg": ""}, "t35": {"title": "squeeze", "shape": "(1, 1536, 1) → (1, 1536)", "body": "去掉最后那个 1。训练时这一行去和真实表达比。", "svg": ""}, "t36": {"title": "output-tensor", "shape": "(1, 1536)", "body": "训练时的表达预测。1536 个基因，每个一个数。推理不返回这个。", "svg": ""}};
const card = document.getElementById("card");
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fitInset(el) {
  const left = document.getElementById("diagram");
  const leftScale = left.getBoundingClientRect().width / left.viewBox.baseVal.width;
  const g = el.querySelector("g.graph");
  const m = /scale\(\s*([0-9.]+)/.exec((g && g.getAttribute("transform")) || "");
  const inner = m ? parseFloat(m[1]) : 1;
  const sample = el.querySelector('text[font-size="10.00"]') || el.querySelector("text");
  const font = sample ? (parseFloat(sample.getAttribute("font-size")) || 10) : 10;
  el.removeAttribute("width");
  el.removeAttribute("height");
  el.style.width = (el.viewBox.baseVal.width * leftScale * 10 / (font * inner)) + "px";
  el.style.height = "auto";
}
function show(tip) {
  card.innerHTML =
    '<p class="kicker">hover</p>' +
    '<h2>' + esc(tip.title) + '</h2>' +
    (tip.shape ? '<div class="shape">' + esc(tip.shape) + '</div>' : '') +
    '<p>' + esc(tip.body || "") + '</p>';
  if (!tip.svg) return;
  const src = document.getElementById("svg-" + tip.svg);
  if (!src) return;
  const el = src.content.querySelector("svg").cloneNode(true);
  el.classList.add("inset");
  card.appendChild(el);
  fitInset(el);
}
document.querySelectorAll("[data-tip]").forEach(el => {
  el.addEventListener("mouseenter", () => {
    document.querySelectorAll(".is-hot").forEach(n => n.classList.remove("is-hot"));
    el.classList.add("is-hot");
    show(TIPS[el.getAttribute("data-tip")]);
  });
});
</script>
