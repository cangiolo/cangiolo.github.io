<!DOCTYPE html>

<head>

<title>State Embedding</title>
<style>
  :root {
    --ink: #1c1917;
    --muted: #6e665e;
    --line: #e4dcd0;
    --paper: #f3efe7;
    --card: #fffdf9;
    --hot: #9a4e12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif;
  }
  header {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 28px 8px;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  h1 {
    margin: 0;
    font-size: 28px;
    font-weight: 560;
    letter-spacing: -0.02em;
  }
  .stage {
    display: grid;
    grid-template-columns: 460px max-content;
    gap: 28px;
    width: max-content;
    margin: 0 auto;
    padding: 12px 28px 48px;
    align-items: start;
  }
  .canvas {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 8px 20px;
    position: sticky;
    top: 16px;
    width: 460px;
    max-width: 460px;
  }
  #diagram {
    width: 100% !important;
    height: auto;
    display: block;
  }
  #diagram .node, #diagram .cluster { cursor: pointer; }
  #diagram .node polygon { transition: stroke 0.12s ease, stroke-width 0.12s ease; }
  #diagram .node.is-hot polygon { stroke: var(--hot); stroke-width: 1.6; }
  #diagram .cluster polygon { transition: stroke 0.12s ease; }
  #diagram .cluster.is-hot polygon { stroke: var(--hot); }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 22px 18px;
    min-height: 220px;
    position: sticky;
    top: 16px;
    width: max-content;
    max-width: none;
  }
  .card .kicker {
    font-family: "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 560;
  }
  .card .shape {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    background: #f6f1e8;
    border-radius: 8px;
    padding: 3px 8px;
    margin-bottom: 12px;
  }
  .card p {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .card svg.inset {
    display: block;
    height: auto;
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: white;
  }
  .card .hint {
    color: var(--muted);
  }
  @media (max-width: 760px) {
    .stage { grid-template-columns: 1fr; }
    .canvas, .card { position: static; }
  }
</style>
</head>

const card = document.getElementById("card");
function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fitInset(el) {
  const left = document.getElementById("diagram");
  const leftScale = left.getBoundingClientRect().width / left.viewBox.baseVal.width;
  const g = el.querySelector("g.graph");
  const m = /scale\(\s*([0-9.]+)/.exec(g.getAttribute("transform") || "");
  const inner = m ? parseFloat(m[1]) : 1;
  const sample = el.querySelector('text[font-size="10.00"]') || el.querySelector("text");
  const font = parseFloat(sample.getAttribute("font-size")) || 10;
  el.removeAttribute("width");
  el.removeAttribute("height");
  el.style.width = (el.viewBox.baseVal.width * leftScale * 10 / (font * inner)) + "px";
  el.style.height = "auto";
}
function show(tip) {
  card.innerHTML =
    '<p class="kicker">hover</p>' +
    '<h2>' + esc(tip.title) + '</h2>' +
    '<div class="shape">' + esc(tip.shape) + '</div>' +
    '<p>' + esc(tip.body) + '</p>';
  if (!tip.svg) return;
  const src = document.getElementById("svg-" + tip.svg);
  const el = src.content.querySelector("svg").cloneNode(true);
  card.appendChild(el);
  fitInset(el);
}
function bind(el, id) {
  const tip = TIPS[id];
  if (!tip) return;
  el.addEventListener("mouseenter", () => {
    document.querySelectorAll(".is-hot").forEach(n => n.classList.remove("is-hot"));
    el.classList.add("is-hot");
    show(tip);
  });
}
document.querySelectorAll("#diagram .node").forEach(el => bind(el, el.id));
document.querySelectorAll("#diagram .cluster").forEach(el => bind(el, el.id));
</script>
