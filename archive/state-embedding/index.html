<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>State Embedding</title>
<style>
  :root {
    --ink: #1c1917;
    --muted: #6e665e;
    --line: #e4dcd0;
    --paper: #f3efe7;
    --card: #fffdf9;
    --hot: #9a4e12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Songti SC", serif;
  }
  header {
    max-width: 1280px;
    margin: 0 auto;
    padding: 28px 28px 8px;
  }
  header p {
    margin: 6px 0 0;
    color: var(--muted);
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  h1 { margin: 0; font-size: 28px; font-weight: 560; letter-spacing: -0.02em; }
  .stage {
    display: grid;
    grid-template-columns: 460px 520px;
    gap: 28px;
    width: max-content;
    margin: 0 auto;
    padding: 12px 28px 48px;
    align-items: start;
  }
  .canvas {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 8px 20px;
    position: sticky;
    top: 16px;
    width: 460px;
    max-width: 460px;
  }
  #diagram { width: 100% !important; height: auto; display: block; }
  #diagram [data-tip] { cursor: pointer; }
  #diagram .node polygon, #diagram .cluster polygon { transition: stroke 0.12s ease; }
  #diagram .is-hot polygon { stroke: var(--hot); stroke-width: 1.6; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 22px 18px;
    min-height: 220px;
    position: sticky;
    top: 16px;
    width: auto;
    max-width: 100%;
    max-height: calc(100vh - 32px);
    overflow: auto;
  }
  .card .kicker {
    font-family: "Helvetica Neue", Helvetica, sans-serif;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 560; }
  .card .shape {
    display: inline-block;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 13px;
    background: #f6f1e8;
    border-radius: 8px;
    padding: 3px 8px;
    margin-bottom: 12px;
  }
  .card p {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, "PingFang SC", sans-serif;
    font-size: 15px;
    line-height: 1.6;
  }
  .card svg.inset {
    display: block;
    max-width: 100%;
    height: auto;
    margin-top: 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: white;
  }
  .card .hint { color: var(--muted); }
</style>
</head>

<script>
const TIPS = {"t0": {"title": "cell expression matrix", "shape": "(1, n_genes)", "body": "n_genes 是该数据集的基因数。按 pad_length = 2048 抽出 cell sentence（位置 0 留给 CLS），再去查 ESM-2，得到 (1, 2048, 5120)；同一批基因的表达量权重是 (1, 2048)", "svg": ""}, "t1": {"title": "TokenEncoder", "shape": "5120 → 512", "body": "图上的名字。代码里是 self.encoder，不是一个叫 TokenEncoder 的类。", "svg": ""}, "t2": {"title": "CountEncoder", "shape": "标量 → 512", "body": "图上的名字。代码里接近 self.count_encoder，再加 self.bin_encoder。", "svg": ""}, "t3": {"title": "TransformerStack", "shape": "8 层，宽度 512，16 头", "body": "双向 Transformer。token 是基因，不是细胞。一次前向只有一个细胞的句子。", "svg": ""}, "t4": {"title": "ExpressionDecoder", "shape": "512 → 512", "body": "图上的名字。代码里是 self.decoder。不预测被遮住的表达，那是训练时的 binary_decoder。", "svg": ""}, "t5": {"title": "ESM-2 Emb", "shape": "(1, 2048, 5120)", "body": "已经算好的基因嵌入。每个基因 5120 维，ESM-2 不在这个模型里面。位置 0 进 Linear 之前会被可学习的 CLS 盖掉。", "svg": ""}, "t6": {"title": "clone", "shape": "(1, 2048, 5120)", "body": "不是仓库里的层。追踪时复制一份张量，好让下一行改位置 0。真实 forward 是直接在查出的嵌入上改位置 0。", "svg": ""}, "t7": {"title": "counts", "shape": "(1, 2048)", "body": "和左边基因一一对应，但不是原始 UMI。每个数是该基因 log1p 表达量占全细胞 log1p 总和的比例，再乘 100。位置 0 是 CLS 的占位。", "svg": ""}, "t8": {"title": "unsqueeze", "shape": "(1, 2048) → (1, 2048, 1)", "body": "给每个 count 加一个特征维，后面的 Linear 才能把一个标量投进 10 个 bin。", "svg": ""}, "t9": {"title": "Linear", "shape": "(1, 2048, 5120) → (1, 2048, 512)", "body": "TokenEncoder 的第一层。把 ESM-2 的 5120 维投到模型宽度 512。CLS 那一位也走这一层。", "svg": ""}, "t10": {"title": "LayerNorm", "shape": "(1, 2048, 512)", "body": "投完维之后做层归一化，再交给 SiLU。形状不变。", "svg": ""}, "t11": {"title": "SiLU", "shape": "(1, 2048, 512)", "body": "TokenEncoder 的激活。没有第二层线性层，这一步还不混合基因之间的信息。", "svg": ""}, "t12": {"title": "mul", "shape": "(1, 2048, 512)", "body": "乘上 √512。这是 Transformer 常用的嵌入缩放，不是 QK 点积之后的那个除法。", "svg": ""}, "t13": {"title": "add", "shape": "2 × (1, 2048, 512) → (1, 2048, 512)", "body": "基因嵌入加上表达量嵌入。相加，不是拼接。", "svg": ""}, "t14": {"title": "Sequential", "shape": "(1, 2048, 1) → (1, 2048, 10)", "body": "原代码是 emb/nn/model.py 里的 count_encoder。虚线框只有前三层。softmax 之后不是再接一个线性层。右边 Embedding 是 bin_encoder，单独初始化的 10 个 512 维向量。", "svg": "count_path"}, "t15": {"title": "softmax", "shape": "(1, 2048, 10)", "body": "把 10 个 bin logits 变成权重。这是软分箱，不是在基因上做 softmax。", "svg": ""}, "t16": {"title": "matmul", "shape": "(1, 2048, 10) → (1, 2048, 512)", "body": "用 bin 权重对 10 个可学习的 bin 向量求加权和。", "svg": ""}, "t17": {"title": "OneEncoderLayer × 8", "shape": "(1, 2048, 512)", "body": "原代码是 emb/nn/flash_transformer.py 的一层。QK 点积再除以 √32 在 scaled_dot_product_attention 里。8 层权重是分开的，图上收成一层再循环。", "svg": "encoder_layer"}, "t18": {"title": "SkipBlock", "shape": "(1, 2048, 512)", "body": "原代码是 emb/nn/model.py 里的 SkipBlock。每个位置单独走 Linear(512→1024)、ReLU、Linear(1024→512)，再和输入相加，最后 LayerNorm。", "svg": "skip_block"}, "t19": {"title": "Linear", "shape": "(1, 2048, 512) → (1, 2048, 512)", "body": "Decoder 的输出投影。宽度还是 512。细胞向量还不在这里取。", "svg": ""}, "t20": {"title": "ClsReadout", "shape": "(1, 2048, 512) → (1, 512)", "body": "只取位置 0，也就是 CLS，再做 L2 归一化。训练时这个向量交给 binary_decoder 去重建表达。推理不跑那个头。右边是它的结构：细胞嵌入、目标基因嵌入、测序深度、数据集嵌入拼成 1035，过两个 SkipBlock，每个基因出一个数。目标基因数是代码默认的 1536，不是输入句子的 2048。", "svg": "binary_decoder"}, "t21": {"title": "output-tensor", "shape": "(1, 512)", "body": "交出去的细胞嵌入。State Transition 用它的时候，每个 token 就是这样一个向量。", "svg": ""}};
const card = document.getElementById("card");
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function fitInset(el) {
  const left = document.getElementById("diagram");
  const leftScale = left.getBoundingClientRect().width / left.viewBox.baseVal.width;
  const g = el.querySelector("g.graph");
  const m = /scale\(\s*([0-9.]+)/.exec((g && g.getAttribute("transform")) || "");
  const inner = m ? parseFloat(m[1]) : 1;
  const sample = el.querySelector('text[font-size="10.00"]') || el.querySelector("text");
  const font = sample ? (parseFloat(sample.getAttribute("font-size")) || 10) : 10;
  el.removeAttribute("width");
  el.removeAttribute("height");
  el.style.width = (el.viewBox.baseVal.width * leftScale * 10 / (font * inner)) + "px";
  el.style.height = "auto";
}
function show(tip) {
  card.innerHTML =
    '<p class="kicker">hover</p>' +
    '<h2>' + esc(tip.title) + '</h2>' +
    (tip.shape ? '<div class="shape">' + esc(tip.shape) + '</div>' : '') +
    '<p>' + esc(tip.body || "") + '</p>';
  if (!tip.svg) return;
  const src = document.getElementById("svg-" + tip.svg);
  if (!src) return;
  const el = src.content.querySelector("svg").cloneNode(true);
  el.classList.add("inset");
  card.appendChild(el);
  fitInset(el);
}
document.querySelectorAll("[data-tip]").forEach(el => {
  el.addEventListener("mouseenter", () => {
    document.querySelectorAll(".is-hot").forEach(n => n.classList.remove("is-hot"));
    el.classList.add("is-hot");
    show(TIPS[el.getAttribute("data-tip")]);
  });
});
</script>
